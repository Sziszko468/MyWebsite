<!doctype html>
<html lang="hu" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      The brand typeface, asked for as soon as the HTML is read rather than when the first headline needs it.
      Without this the font arrived seconds after the first paint on a slow connection and the swap moved the
      hero (layout shift 0.15 to 0.4 in the emulated-phone run). Vite gives the file its hashed name.
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2" />
    <title>Your Name</title>
    <meta name="description" content="Átgondolt weboldalakat és webalkalmazásokat tervezek és fejlesztek." />
    <meta name="theme-color" content="#0b0b0d" />
    <!-- Site-wide Open Graph tags. The app replaces them per page and language once it runs (src/routes/documentMeta.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Your Name" />
    <meta property="og:title" content="Your Name" />
    <meta property="og:description" content="Átgondolt weboldalakat és webalkalmazásokat tervezek és fejlesztek." />

    <!--
      Pre-paint theme: runs before first paint so the page never flashes the wrong theme.
      Keep in step with src/theme/theme.ts (storage key + resolution rule); theme.test.ts checks it.
      The background colours below only cover the moment before the stylesheet arrives and
      must equal --color-bg in src/styles/tokens.css.
    -->
    <style>
      html { background-color: #0b0b0d; }
      html[data-theme='light'] { background-color: #f4f0e8; }
    </style>
    <script>
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
